name: SoftDiary
options:
  bundleIdPrefix: com.softdiary
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_CFBundleDisplayName: SoftDiary
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_LSRequiresIPhoneOS: true
    INFOPLIST_KEY_NSCameraUsageDescription: SoftDiary uses the camera to take journal photos. Photos stay on this device.
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: SoftDiary uses your photo library to choose journal photos. Photos stay on this device.
    INFOPLIST_KEY_NSMicrophoneUsageDescription: SoftDiary uses the microphone to record voice notes. Recordings stay on this device.
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: SoftDiary may save images to your photo library when you choose to.
    INFOPLIST_KEY_NSFaceIDUsageDescription: SoftDiary uses Face ID to unlock your journal lock quickly.
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  SoftDiary:
    type: application
    platform: iOS
    sources:
      - SoftDiary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.softdiary.app
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        INFOPLIST_KEY_NSCameraUsageDescription: SoftDiary uses the camera to take journal photos. Photos stay on this device.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: SoftDiary uses your photo library to choose journal photos. Photos stay on this device.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: SoftDiary uses the microphone to record voice notes. Recordings stay on this device.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: SoftDiary may save images to your photo library when you choose to.
        INFOPLIST_KEY_NSFaceIDUsageDescription: SoftDiary uses Face ID to unlock your journal lock quickly.
